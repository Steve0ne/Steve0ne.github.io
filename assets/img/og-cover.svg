  <rect x="44" y="40" width="1112" height="550" rx="40" fill="url(#auraB)"/>
  <rect x="56" y="52" width="1088" height="526" rx="30" fill="none" stroke="url(#stroke)" stroke-width="1.5"/>
  <rect x="92" y="96" width="224" height="58" rx="29" fill="#0f141d" stroke="#2c3647" stroke-width="1.2"/>
  <text x="126" y="133" fill="#d6deec" font-family="Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700" letter-spacing="0.14em">STEV5</text>
