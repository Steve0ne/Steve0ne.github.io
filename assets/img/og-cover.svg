    and field notes from reliable delivery.
  </text>
  <rect x="780" y="150" width="266" height="318" rx="32" fill="#0d1219" stroke="#2a3343" stroke-width="1.4"/>
  <text x="822" y="213" fill="#aab7cf" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="21" letter-spacing="0.16em">JOURNAL</text>
