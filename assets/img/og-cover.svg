      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#95a8cc" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#04060a"/>
  <rect x="44" y="40" width="1112" height="550" rx="40" fill="url(#bg)"/>
