<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Stev5 social cover</title>
  <desc id="desc">Dark premium social sharing cover for the Stev5 personal homepage and journal.</desc>
  <defs>
    <linearGradient id="bg" x1="112" x2="1088" y1="72" y2="558" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10141d"/>
      <stop offset="1" stop-color="#06080c"/>
    </linearGradient>
    <radialGradient id="auraA" cx="0" cy="0" r="1" gradientTransform="translate(285 130) rotate(17) scale(420 240)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9cb0d8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#9cb0d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraB" cx="0" cy="0" r="1" gradientTransform="translate(930 508) rotate(181) scale(360 210)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a5d7e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4a5d7e" stop-opacity="0"/>
    </radialGradient>
