  <text x="822" y="325" fill="#f5f7fb" font-family="Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700">Useful AI.</text>
  <text x="822" y="371" fill="#f5f7fb" font-family="Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700">Measured work.</text>
  <text x="822" y="442" fill="#95a3ba" font-family="Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="500">steve0ne.github.io</text>
